version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: standard
    filename: logs/equity_ml.log
    maxBytes: 10485760 # 10 MB
    backupCount: 5

root:
  level: INFO
  handlers: [console, file]

loggers:
  equity_ml:
    level: DEBUG
    handlers: [console, file]
    propagate: false
