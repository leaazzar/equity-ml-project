[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "equity-ml"
version = "0.1.0"
description = "Quantitative equity research pipeline (infrastructure phase; WRDS data not yet integrated)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Lea Azar", email = "lea.g.azar1@gmail.com" }]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "wrds>=3.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/equity_ml", "src/data_validation", "src/data_processing", "src/feature_engineering"]

# --- Ruff (lint + format) ---
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# registry.py is a documentation/data file: long descriptive prose strings
# inside FeatureSpec entries are more readable unwrapped than force-broken
# at 100 columns.
"src/feature_engineering/registry.py" = ["E501"]
# units.py's module docstring includes a markdown table documenting every
# field's verified unit; the table rows are more readable unwrapped.
"src/feature_engineering/units.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["equity_ml"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- Mypy ---
# python_version is 3.12 (not 3.11, the floor in requires-python) because
# recent numpy stub releases use PEP 695 syntax that mypy only parses when
# targeting 3.12+; this does not relax the actual minimum supported runtime.
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true
exclude = ["build", "dist", "\\.venv"]

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=equity_ml --cov=data_validation --cov=data_processing --cov=feature_engineering --cov-report=term-missing"

[tool.coverage.run]
source = ["src/equity_ml", "src/data_validation", "src/data_processing", "src/feature_engineering"]
